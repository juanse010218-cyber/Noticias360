<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Administración | Noticias 360</title>

    <link
        rel="stylesheet"
        href="../css/styles.css">

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header>

        <nav>

            <div class="logo">
                Noticias <span>360</span>
            </div>


            <ul class="menu">

                <li>
                    <a href="../index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="noticias.html">
                        Noticias
                    </a>
                </li>

                <li>
                    <a href="favoritos.html">
                        Favoritos
                    </a>
                </li>

                <li>
                    <a href="contacto.html">
                        Contacto
                    </a>
                </li>

            </ul>


            <a
                href="admin.html"
                class="login-button admin-link">

                Administración

            </a>

        </nav>

    </header>



    <!-- ==========================================
         ADMINISTRACIÓN
    =========================================== -->

    <main class="admin-page">


        <section class="admin-container">


            <!-- ENCABEZADO -->

            <div class="admin-header">

                <div>

                    <h1>
                        Administración de noticias
                    </h1>

                    <p>
                        Gestiona las noticias de Noticias 360.
                    </p>

                </div>


                <button
                    id="new-news-button"
                    class="admin-primary-button">

                    + Nueva noticia

                </button>

            </div>



            <!-- =====================================
                 FORMULARIO
            ====================================== -->

            <section
                id="admin-form-container"
                class="admin-form-container hidden">


                <h2 id="form-title">
                    Crear noticia
                </h2>


                <form
                    id="news-form"
                    novalidate>


                    <!-- ID OCULTO -->

                    <input
                        type="hidden"
                        id="news-id">


                    <!-- TÍTULO -->

                    <div class="admin-form-group">

                        <label for="news-title">
                            Título*
                        </label>

                        <input
                            type="text"
                            id="news-title"
                            placeholder="Título de la noticia">

                        <small
                            id="title-error"
                            class="admin-error">
                        </small>

                    </div>


                    <!-- CATEGORÍA -->

                    <div class="admin-form-group">

                        <label for="news-category">
                            Categoría*
                        </label>

                        <select id="news-category">

                            <option value="">
                                Selecciona una categoría
                            </option>

                            <option value="Tecnología">
                                Tecnología
                            </option>

                            <option value="Turismo">
                                Turismo
                            </option>

                            <option value="Educación">
                                Educación
                            </option>

                            <option value="Negocios">
                                Negocios
                            </option>

                        </select>

                        <small
                            id="category-error"
                            class="admin-error">
                        </small>

                    </div>


                    <!-- FECHA -->

                    <div class="admin-form-group">

                        <label for="news-date">
                            Fecha*
                        </label>

                        <input
                            type="date"
                            id="news-date">

                        <small
                            id="date-error"
                            class="admin-error">
                        </small>

                    </div>


                    <!-- IMAGEN -->

                    <div class="admin-form-group">

    <label for="news-image">
        Imagen*
    </label>

    <input
        type="file"
        id="news-image"
        accept="image/*">

    <small
        id="image-error"
        class="admin-error">
    </small>

    <div id="image-preview" class="image-preview">
    </div>

</div>


                    <!-- DESCRIPCIÓN -->

                    <div class="admin-form-group admin-full">

                        <label for="news-description">
                            Descripción*
                        </label>

                        <textarea
                            id="news-description"
                            rows="3"
                            placeholder="Descripción breve de la noticia">
                        </textarea>

                        <small
                            id="description-error"
                            class="admin-error">
                        </small>

                    </div>


                    <!-- CONTENIDO -->

                    <div class="admin-form-group admin-full">

                        <label for="news-content">
                            Contenido*
                        </label>

                        <textarea
                            id="news-content"
                            rows="6"
                            placeholder="Contenido completo de la noticia">
                        </textarea>

                        <small
                            id="content-error"
                            class="admin-error">
                        </small>

                    </div>


                    <!-- BOTONES -->

                    <div class="admin-form-actions">

                        <button
                            type="submit"
                            class="admin-primary-button">

                            Guardar noticia

                        </button>


                        <button
                            type="button"
                            id="cancel-button"
                            class="admin-secondary-button">

                            Cancelar

                        </button>

                    </div>

                </form>

            </section>



            <!-- =====================================
                 LISTADO
            ====================================== -->

            <section class="admin-list-section">


                <div class="admin-list-header">

                    <h2>
                        Noticias registradas
                    </h2>

                    <span id="news-counter">
                        0 noticias
                    </span>

                </div>


                <div
                    id="admin-news-list"
                    class="admin-news-list">

                </div>

            </section>


        </section>

    </main>



    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer>

        <p>
            © 2026 Noticias 360.
            Todos los derechos reservados.
        </p>

    </footer>



    <script src="../js/admin.js"></script>

</body>

</html>
