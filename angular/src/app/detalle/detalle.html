<section class="detalle-container">

  @if (noticia) {

    <article class="detalle-card">

      <img
        class="detalle-imagen"
        [src]="'assets/images/' + noticia.imagen"
        [alt]="noticia.titulo"
      >

      <div class="detalle-contenido">

        <span class="categoria">
          {{ noticia.categoria }}
        </span>

        <h1>
          {{ noticia.titulo }}
        </h1>

        <p class="fecha">
          {{ noticia.fecha }}
        </p>

        <p class="descripcion">
          {{ noticia.descripcion }}
        </p>

        <div class="contenido">
          <p>
            {{ noticia.contenido }}
          </p>
        </div>

        <a
          routerLink="/noticias"
          class="volver"
        >
          ← Volver a noticias
        </a>

      </div>

    </article>

  } @else {

    <div class="no-encontrada">

      <h1>Noticia no encontrada</h1>

      <a routerLink="/noticias">
        Volver a noticias
      </a>

    </div>

  }

</section>
